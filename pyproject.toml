[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "cpra.mp.data"
version = "0.35.0"
description = "Tools for reading and writing data from Louisiana's Coastal Master Plan"
readme = "README.md"
requires-python = ">=3.12"
keywords = []
authors = [{ name = "Matt Yoder", email = "mjyoder@psc.edu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "altair",
    "cachetools",
    "click",
    "mercantile",
    "numpy",
    "Pillow",
    "polars",
    "pyarrow",
    "python-dotenv",
    "rasterio",
    "scipy",
]

[project.optional-dependencies]
api = ["fastapi[standard]>=0.115.0", "psycopg2-binary", "sqlmodel"]
bridges2 = [
    "connectorx",
    "geojson",
    "geopandas",
    "openpyxl",
    "pandas",
    "psycopg2-binary",
    "sqlalchemy",
    "topojson"
]
scripts = ["fastexcel", "tippecanoe"]

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
typeCheckingMode = "off"

[tool.uv.build-backend]
module-name = "cpra.mp.data"
module-root = ""
