[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "cpra.mp.data"
version = "0.49.0"
description = "Tools for reading and writing data from Louisiana's Coastal Master Plan"
readme = "README.md"
requires-python = ">=3.12"
keywords = []
authors = [{ name = "Matt Yoder", email = "mjyoder@psc.edu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "altair",
    "cachetools",
    "click",
    "mercantile",
    "numpy",
    "Pillow",
    "pmtiles>=3.7.0",
    "polars>=1.41.2",
    "pyarrow",
    "pyogrio>=0.12.1",
    "python-dotenv",
    "rasterio",
    "scipy",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.115.0",
    "geopandas>=0.14.4",
    "mapbox-vector-tile>=2.2.0",
    "psycopg2-binary",
    "shapely",
    "sqlmodel",
]
bridges2 = [
    "anywidget",
    "connectorx",
    "geojson",
    "geopandas",
    "openpyxl",
    "pandas",
    "psycopg2-binary",
    "sqlalchemy",
    "sympy",
    "topojson",
    "traitlets",
]
jupyter = [
    "jupyterlab>=4.5.7",
    "maplibre[all]"
]
scripts = ["affine", "fastexcel", "playwright", "pyproj", "tippecanoe"]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115.0",
    "mapbox-vector-tile>=2.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "sqlmodel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=cpra.mp.data --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
# Fail on deprecations this package is responsible for, so they get fixed rather than
# accumulating. Deliberately narrow: a blanket "error" would break the build on unrelated
# deprecations from rasterio/GDAL, Polars, or Starlette on any dependency bump.
filterwarnings = [
    "error::DeprecationWarning:cpra.*",
    "error::DeprecationWarning:tests.*",
    "error::pydantic.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["cpra/mp/data"]
omit = [
    "cpra/mp/data/visualizations/*",
    "cpra/mp/data/api/__main__.py",
    "cpra/mp/data/cli/__main__.py",
]

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
typeCheckingMode = "off"

[tool.uv.sources]
maplibre = { git = "https://github.com/jpuerto-psc/py-maplibregl" }

[tool.uv.build-backend]
module-name = "cpra.mp.data"
module-root = ""
