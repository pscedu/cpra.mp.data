name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned to 3.13: rasterio/GDAL does not have prebuilt wheels for every version
      # allowed by requires-python, and 3.13 matches .python-version.
      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --extra api --group dev

      - name: Run tests
        run: uv run --python 3.13 pytest

      # After the tests, and run even if they fail, so a lint error never hides test results.
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run --python 3.13 ruff check .

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run --python 3.13 ruff format --check .

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
