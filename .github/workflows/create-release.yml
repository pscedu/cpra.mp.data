name: Create release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - name: Release please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: python

  build-image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Prepare image
        id: prepare
        run: |
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "image_tag=ghcr.io/${{ github.repository }}:$VERSION" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          docker build . --tag "${{ steps.prepare.outputs.image_tag }}" --label "runnumber=${GITHUB_RUN_ID}"
      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: |
          docker push "${{ steps.prepare.outputs.image_tag }}"

  build-python:
    name: Build and Upload Python Package
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Prepare package name
        id: prepare
        run: |
          PKG_NAME=$(echo "${{ github.event.repository.name }}" | sed -e 's|\.|_|g')
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "package=$PKG_NAME-$VERSION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade build
      - name: Build Python package
        shell: bash
        run: |
          python3 -m build
      - name: Upload archive
        id: upload_archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./dist/${{ steps.prepare.outputs.package }}.tar.gz
          asset_name: ${{ steps.prepare.outputs.package }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload wheel
        id: upload_wheel
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./dist/${{ steps.prepare.outputs.package }}-py3-none-any.whl
          asset_name: ${{ steps.prepare.outputs.package }}-py3-none-any.whl
          asset_content_type: application/zip
