name: Create release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - name: Release please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: python

  build-image-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare image
        id: prepare
        run: |
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "image_tag=ghcr.io/${{ github.repository }}:$VERSION" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Runners start with an empty layer cache, so persist it in the GitHub
      # Actions cache; the dependency layer is then reused across releases
      # until uv.lock or pyproject.toml changes.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.prepare.outputs.image_tag }}
          labels: runnumber=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-image-bridges2:
    name: Build and Push Bridges-2 Image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      packages: write
      contents: read
    container:
      image: ghcr.io/apptainer/apptainer:1.4.3
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare image
        id: prepare
        run: |
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "image_tag=ghcr.io/${{ github.repository }}/bridges2:$VERSION" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          apptainer build bridges2.sif bridges2.def
      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u ${{ github.actor }} --password-stdin oras://ghcr.io
      - name: Push image
        run: |
          apptainer push bridges2.sif "oras://${{ steps.prepare.outputs.image_tag }}"

  build-python:
    name: Build and Upload Python Package
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Prepare package name
        id: prepare
        run: |
          PKG_NAME=$(echo "${{ github.event.repository.name }}" | sed -e 's|\.|_|g')
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "package=$PKG_NAME-$VERSION" >> $GITHUB_OUTPUT
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.18"
      - name: Set up Python
        run: uv python install
      - name: Build Python package
        run: uv build
      - name: Upload archive and wheel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release.outputs.tag_name }} \
            ./dist/${{ steps.prepare.outputs.package }}.tar.gz \
            ./dist/${{ steps.prepare.outputs.package }}-py3-none-any.whl
